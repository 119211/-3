<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>弘哥工作室</title><!--META--><!--/META-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F2F4F1;--ink:#14191A;--mut:#4F5858;--line:#A9B1AD;--ph:#DDE2DE;--accent:#2438D9;--ok:#0B7A5C;--bad:#B42318;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:16px;line-height:1.6}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#fab{position:static;margin-left:12px;min-height:44px;padding:0 18px;background:var(--ink);color:var(--bg);border:0;font-weight:700;font-size:15px;cursor:pointer}
#fab[hidden]{display:none}
.mono{font-family:'JetBrains Mono',monospace}

</style>
<style id="siteCss">
#site{--accent:#2438D9}
.wrap{width:100%;max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#site a:hover .arrow{transform:translate(4px,-4px)}
.hd{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:center;justify-content:space-between;padding-block:24px;border-bottom:2px solid var(--ink)}
.logo{font-family:'Noto Serif TC',serif;font-weight:900;font-size:24px}
.nv{display:flex;flex-wrap:wrap;gap:4px 28px;align-items:center;font-size:15px;font-weight:500}
.nv a.l{padding:12px 0}.nv a.l:hover{color:var(--accent)}
.cta{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;background:var(--accent);color:#fff;font-weight:700}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border:2px solid var(--ink);font-weight:700;font-size:15px;background:transparent}
.btn:hover{background:var(--ink);color:var(--bg)}
.hero{display:flex;flex-direction:column;gap:48px;padding-block:88px 72px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.12em;color:var(--mut)}
h1.big{margin:0;font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(40px,7.4vw,108px);line-height:1.12;text-wrap:balance}
h1.big span{color:var(--accent);display:block}
.lead{margin:0;max-width:36em;font-size:19px;line-height:1.8;color:#364040}
.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.entry{display:flex;flex-direction:column;gap:8px;padding:26px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);min-width:0}
.entry:hover{background:var(--ink);color:var(--bg)}
.entry b{font-size:24px}.entry span{font-size:15px;opacity:.8}
.sec{display:flex;flex-direction:column;gap:36px;padding-block:72px;border-top:2px solid var(--ink)}
.sh{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:baseline;justify-content:space-between}
.sh h2{margin:0;font-family:'Noto Serif TC',serif;font-weight:900;font-size:34px}
.sh span{font-size:15px;color:var(--mut)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:24px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:28px}
.card{display:flex;flex-direction:column;gap:14px;min-width:0}
.pic{border:2px solid var(--ink);background:var(--ph);display:flex;align-items:flex-end;padding:14px;overflow:hidden;position:relative}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic span{font-family:'JetBrains Mono',monospace;font-size:12px;color:#364040}
.topimg{line-height:0;background:var(--bg);border-bottom:2px solid var(--ink)}.topimg img{display:block;width:100%;max-width:1600px;height:auto;margin:0 auto}.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.pic.contain img{object-fit:contain;background:#fff}.thumb.contain img{object-fit:contain;background:#fff}.cert .meta{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--mut);overflow-wrap:anywhere}.r1{aspect-ratio:1/1}.r43{aspect-ratio:4/3}
.nm{font-size:18px;font-weight:700;line-height:1.4}
.ds{font-size:15px;line-height:1.6;color:var(--mut);overflow-wrap:anywhere}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.price{font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--accent)}
.tag{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--accent)}
.arrow{font-size:22px;color:var(--accent);transition:transform .2s}
.note{font-size:14px;line-height:1.7;color:var(--mut);white-space:pre-line}
.sv{display:flex;flex-wrap:wrap;gap:8px 32px;padding:22px 0;border-bottom:1px solid var(--line)}
.sv:first-child{border-top:1px solid var(--line)}
.sv .a{flex:1 1 280px;min-width:0}.sv .a b{font-size:20px;display:block}
.sv .p{flex:0 0 160px;font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--accent)}
.split{display:flex;flex-wrap:wrap;gap:32px 64px}
.split>h2{flex:0 1 240px;margin:0;font-family:'Noto Serif TC',serif;font-weight:900;font-size:34px}
.split>div{flex:1 1 480px;min-width:0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:20px}
.step{display:flex;flex-direction:column;gap:8px;padding:20px;border:2px solid var(--ink);min-width:0}
.step small{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent)}
.step b{font-size:17px}.step span{font-size:14px;color:var(--mut);line-height:1.7}
.ct{display:flex;flex-direction:column;gap:28px;padding-block:88px;border-top:2px solid var(--ink)}
.ct h2{margin:0;font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(32px,5vw,64px);line-height:1.2;text-wrap:balance}
.ct .kv{display:flex;flex-direction:column;gap:10px;font-family:'JetBrains Mono',monospace;font-size:clamp(16px,2.2vw,22px);overflow-wrap:anywhere}
.ct .kv i{font-style:normal;color:var(--mut)}.ct .kv b{font-weight:500;color:var(--accent)}
.ft{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;padding-block:24px 40px;border-top:2px solid var(--ink);font-size:13px;color:var(--mut)}
.empty{border:2px dashed var(--line);padding:28px;color:var(--mut);font-size:15px}

</style>
<style>
#admin{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto}
#admin[hidden]{display:none}
.ahd{position:sticky;top:0;z-index:2;background:var(--ink);color:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.ahd .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding-block:12px}
.ahd b{font-family:'Noto Serif TC',serif;font-size:20px}
.ahd button{min-height:44px;padding:0 18px;background:transparent;color:var(--bg);border:2px solid var(--bg);font-weight:700;cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding-block:18px 0}
.tabs button{min-height:44px;padding:0 18px;border:2px solid var(--ink);background:transparent;font-weight:700;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.ab{padding-block:24px 96px;display:flex;flex-direction:column;gap:24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:16px}
.tile{border:2px solid var(--ink);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.tile small{font-size:13px;color:var(--mut)}
.tile b{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:500;font-variant-numeric:tabular-nums}
.panel{border:2px solid var(--ink);padding:20px;display:flex;flex-direction:column;gap:14px;background:#F8F9F7;min-width:0}
.panel h3{margin:0;font-size:18px}
.panel p{margin:0;color:var(--mut);font-size:14px;line-height:1.7}
.chart{overflow-x:auto}
.chart svg{display:block;min-width:520px;width:100%;height:auto}
.rowline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.rowline b{font-family:'JetBrains Mono',monospace;font-weight:500}
.item{display:flex;flex-wrap:wrap;gap:16px 20px;border:2px solid var(--ink);padding:16px;background:#F8F9F7}
.item.off{opacity:.6}
.thumbcol{flex:0 0 150px;display:flex;flex-direction:column;gap:8px}
.thumb{aspect-ratio:4/3;border:2px solid var(--ink);background:var(--ph);display:grid;place-items:center;font-size:12px;color:var(--mut);position:relative;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fields{flex:1 1 300px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);min-width:0}
.fields label.w{grid-column:1/-1}
.fields input,.fields textarea,.fields select{width:100%;min-height:44px;padding:8px 10px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:16px}
.fields textarea{min-height:84px;resize:vertical}
.tools{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sm{min-height:44px;padding:0 14px;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:14px;cursor:pointer}
.sm:hover{background:var(--ink);color:var(--bg)}
.sm.danger{border-color:var(--bad);color:var(--bad)}.sm.danger:hover{background:var(--bad);color:#fff}
.sm.go{background:var(--accent);border-color:var(--accent);color:#fff}
.sm:disabled{opacity:.4;cursor:default}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;margin-left:auto}
.chk input{width:20px;height:20px}
.sw{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw button{width:44px;height:44px;border:2px solid var(--ink);cursor:pointer}
.sw button[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:12px 20px;font-size:15px;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
</style>

'use strict';
const TEMPLATE='<!doctype html>\n'+document.documentElement.outerHTML;
const EMBED=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const safeUrl=u=>/^https?:\/\//i.test(String(u||'').trim())?String(u).trim():'';
const hex=c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:'#2438D9';
const TRACK_LABEL={buy:'點「購買／詢問購買」',inquiry:'點「我要詢價」或聯絡方式',work:'點作品連結'};
const SWATCHES=['#2438D9','#0B7A5C','#C2410C','#7C2D92'];

let DATA=JSON.parse(JSON.stringify(EMBED)),baseRev=EMBED.rev||0;const COLL=['products','works','services','certs'];
const S={site:{brand:'弘哥工作室'},products:[],works:[],services:[],certs:[],stats:[],dirty:false,auth:null,authLoaded:false,unlocked:false,fails:0,lockUntil:0,gateErr:'',tab:'overview',open:false,dbOk:false,confirm:null,busy:''};

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},3200)}

/* ---------- 前台與匯出共用的網站內容 ---------- */
function siteHTML(d,o){
  const s=d.site||{};const brand=esc(s.brand||'弘哥工作室');
  const vis=a=>a.filter(x=>x.visible!==false);
  const P=vis(d.products),W=vis(d.works),V=d.services,C=vis(d.certs||[]);
  const img=id=>id?o.img(id):'';
  const pic=(id,label,cls)=>`<div class="pic ${cls}">${id&&img(id)?`<img src="${esc(img(id))}" alt="${esc(label)}" loading="lazy">`:`<span>[${esc(label)}]</span>`}</div>`;
  const hint=(t)=>o.edit?`<div class="empty">${t}</div>`:'';
  const nav=[];
  if(P.length||o.edit)nav.push(['shop','賣場']);
  if(W.length||o.edit)nav.push(['works','作品集']);
  if(V.length||o.edit)nav.push(['services','接案服務']);
  if(C.length||o.edit)nav.push(['certs','證書證照']);
  const entries=nav.map(([id,n])=>{const sub={shop:'現成商品，下單即可取得。',works:'過去完成的專案與成果。',services:'客製需求，報價與流程透明。',certs:'結業證書與專業證照。'}[id];const t={shop:'逛賣場',works:'看作品',services:'找我接案',certs:'看證照'}[id];return `<a class="entry" href="#${id}"><b>${t}</b><span>${sub}</span><span style="font-size:22px;margin-top:6px">↓</span></a>`}).join('');
  const inq=`<a class="cta" href="#contact" data-track="inquiry">我要詢價</a>`;
  const topimg=s.imageId&&img(s.imageId)?`<div class="topimg"><img src="${esc(img(s.imageId))}" alt="${brand}"></div>`:'';
  let h=`${topimg}<div class="wrap">
<header class="hd"><a class="logo" href="#top">${brand}</a><nav class="nv" aria-label="主選單">${nav.map(([id,n])=>`<a class="l" href="#${id}">${n}</a>`).join('')}${inq}</nav></header>
<section id="top" class="hero"><div style="display:flex;flex-direction:column;gap:28px">
${s.eyebrow?`<div class="eyebrow">${esc(s.eyebrow)}</div>`:''}
<h1 class="big${s.imageId&&img(s.imageId)?' sr':''}">${brand}${s.tagline?`<span>${esc(s.tagline)}</span>`:''}</h1>
${s.lead?`<p class="lead">${esc(s.lead)}</p>`:''}</div>
${entries?`<div class="entries">${entries}</div>`:''}</section>`;
  if(P.length||o.edit){
    h+=`<section id="shop" class="sec"><div class="sh"><h2>賣場</h2>${s.shopIntro?`<span>${esc(s.shopIntro)}</span>`:''}</div>`;
    h+=P.length?`<div class="grid4">${P.map(p=>{const u=safeUrl(p.link);return `<div class="card">${pic(p.imageId,'商品圖','r1')}<div class="nm">${esc(p.name)}</div>${p.desc?`<div class="ds">${esc(p.desc)}</div>`:''}<div class="row"><span class="price">${esc(p.price)}</span>${u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener" data-track="buy">購買</a>`:`<a class="btn" href="#contact" data-track="buy">詢問購買</a>`}</div></div>`}).join('')}</div>`:hint('還沒有商品。按右下角「進入後台」新增第一件商品。');
    if(s.shopNote)h+=`<div class="note">${esc(s.shopNote)}</div>`;
    h+=`</section>`;
  }
  if(W.length||o.edit){
    h+=`<section id="works" class="sec"><div class="sh"><h2>作品集</h2></div>`;
    h+=W.length?`<div class="grid3">${W.map(w=>{const u=safeUrl(w.link);const inner=`${pic(w.imageId,'作品圖','r43')}<div class="row" style="align-items:flex-start"><div style="min-width:0">${(w.type||w.year)?`<div class="tag">${esc([w.type,w.year].filter(Boolean).join(' · '))}</div>`:''}<div class="nm" style="font-size:20px;margin-top:4px">${esc(w.title)}</div>${w.summary?`<div class="ds" style="margin-top:6px">${esc(w.summary)}</div>`:''}</div>${u?`<span class="arrow">↗</span>`:''}</div>`;return u?`<a class="card" href="${esc(u)}" target="_blank" rel="noopener" data-track="work">${inner}</a>`:`<div class="card">${inner}</div>`}).join('')}</div>`:hint('還沒有作品。按右下角「進入後台」新增作品。');
    h+=`</section>`;
  }
  if(V.length||o.edit){
    const dep=s.deposit?`收訂金 ${esc(s.deposit)}。`:'確認範圍與金額後簽約。';
    const rev=s.revisions?`修改 ${esc(s.revisions)} 次內免費。`:'階段交付，依約定修改。';
    h+=`<section id="services" class="sec"><div class="split"><h2>接案服務</h2><div>${V.length?V.map(v=>`<div class="sv"><div class="a"><b>${esc(v.name)}</b>${v.desc?`<span class="ds">${esc(v.desc)}</span>`:''}</div>${v.price?`<div class="p">${esc(v.price)}</div>`:''}</div>`).join(''):hint('還沒有服務項目。按右下角「進入後台」新增。')}</div></div>
<div style="display:flex;flex-direction:column;gap:20px"><h3 style="margin:0;font-size:20px">合作流程</h3><div class="steps">
<div class="step"><small>STEP 1</small><b>需求討論</b><span>說明想做什麼、預算與期限。</span></div>
<div class="step"><small>STEP 2</small><b>報價與簽約</b><span>${dep}</span></div>
<div class="step"><small>STEP 3</small><b>製作與回報</b><span>${rev}</span></div>
<div class="step"><small>STEP 4</small><b>驗收與尾款</b><span>確認無誤後付尾款並交付檔案。</span></div></div></div></section>`;
  }
  if(C.length||o.edit){
    h+=`<section id="certs" class="sec"><div class="sh"><h2>證書與證照</h2>${s.certIntro?`<span>${esc(s.certIntro)}</span>`:''}</div>`;
    h+=C.length?`<div class="grid3">${C.map(c=>{const u=safeUrl(c.link);const meta=[c.issuer,c.date?('取得 '+c.date):'',c.expires?('有效至 '+c.expires):'',c.number?('證號 '+c.number):''].filter(Boolean);return `<div class="card cert">${pic(c.imageId,'證書影像','r43 contain')}<div class="nm">${esc(c.name)}</div>${meta.length?`<div class="meta">${meta.map(esc).join('<br>')}</div>`:''}${u?`<a class="btn" style="align-self:flex-start" href="${esc(u)}" target="_blank" rel="noopener">查驗證書 ↗</a>`:''}</div>`}).join('')}</div>`:hint('還沒有證書。按右下角「進入後台」→「證書證照」新增。');
    h+=`</section>`;
  }
  const em=s.email?`<div><i>Email　</i><b>${esc(s.email)}</b></div>`:'';
  const ln=s.line?`<div><i>LINE　</i><b>${esc(s.line)}</b></div>`:'';
  h+=`<section id="contact" class="ct"><h2>有案子想談？<br>直接跟${brand.replace(/工作室$/,'')}聊。</h2>${(em||ln)?`<div class="kv" data-track="inquiry">${em}${ln}</div>`:hint('還沒有填聯絡方式。到後台「網站設定」填 Email 與 LINE。')}${s.replyDays?`<div class="ds">通常 ${esc(s.replyDays)} 個工作天內回覆。</div>`:''}</section>
<footer class="ft"><span>© ${new Date().getFullYear()} ${brand}</span>${s.city?`<span class="mono">${esc(s.city)}</span>`:''}</footer></div>`;
  return h;
}
function imgSrc(id){return (DATA.imgs&&DATA.imgs[id])||''}
function renderSite(){
  const el=$('#site');el.style.setProperty('--accent',hex(S.site.accent));
  document.documentElement.style.setProperty('--accent',hex(S.site.accent));
  const fab=$('#fab');document.body.appendChild(fab);el.innerHTML=siteHTML(S,{img:imgSrc,edit:S.unlocked});
  const hideFab=S.site.showAdminBtn===false;fab.hidden=hideFab;const cta=el.querySelector('.cta');if(cta)cta.after(fab);el.style.paddingTop='0';
}
/* ---------- 後台 ---------- */
const lbl=(t,inner,w)=>`<label class="${w?'w':''}"><span>${t}</span>${inner}</label>`;
const inp=(f,v,type)=>`<input data-f="${f}" type="${type||'text'}" value="${esc(v)}" ${type==='number'?'inputmode="numeric"':''}>`;
const area=(f,v)=>`<textarea data-f="${f}">${esc(v)}</textarea>`;
function thumb(it,ct){return `<div class="thumbcol"><div class="thumb${ct?' contain':''}">${it.imageId?`<img src="${esc(imgSrc(it.imageId))}" alt="">`:'沒有圖片'}</div>${`<button class="sm" data-act="upload">${S.busy===it.id?'上傳中…':(it.imageId?'換圖片':'上傳圖片')}</button>${it.imageId?`<button class="sm" data-act="rmimg">移除圖片</button>`:''}`}</div>`}
function tools(list,it,coll,vis){
  const i=list.findIndex(x=>x.id===it.id);const cf=S.confirm===coll+'/'+it.id;
  return `<div class="tools"><button class="sm" data-act="up" ${i<=0?'disabled':''} aria-label="往前移">↑ 往前</button><button class="sm" data-act="down" ${i>=list.length-1?'disabled':''} aria-label="往後移">↓ 往後</button>
${vis?`<label class="chk"><input type="checkbox" data-f="visible" ${it.visible!==false?'checked':''}>顯示在網站上</label>`:''}
<button class="sm danger" data-act="del" ${vis?'':'style="margin-left:auto"'}>${cf?'再按一次確認刪除':'刪除'}</button></div>`;
}
function itemRow(coll,list,it){
  let f='',th='';
  if(coll==='products'){th=thumb(it);f=lbl('商品名稱',inp('name',it.name))+lbl('價格（直接輸入顯示文字）',inp('price',it.price))+lbl('說明',area('desc',it.desc),1)+lbl('購買連結（選填，https://…）',inp('link',it.link,'url'),1)}
  if(coll==='works'){th=thumb(it);f=lbl('專案名稱',inp('title',it.title))+lbl('類型',inp('type',it.type))+lbl('年份',inp('year',it.year))+lbl('成果說明',area('summary',it.summary),1)+lbl('作品連結（選填，https://…）',inp('link',it.link,'url'),1)}
  if(coll==='certs'){th=thumb(it,true);f=lbl('證書／證照名稱',inp('name',it.name),1)+lbl('頒發單位',inp('issuer',it.issuer))+lbl('取得日期（例如 2025-06）',inp('date',it.date))+lbl('有效至（選填）',inp('expires',it.expires))+lbl('證號（選填，會公開顯示）',inp('number',it.number))+lbl('查驗連結（選填，https://…）',inp('link',it.link,'url'),1)}
  if(coll==='services'){f=lbl('服務項目',inp('name',it.name))+lbl('價格（例如 NT$ 5,000 起）',inp('price',it.price))+lbl('說明',area('desc',it.desc),1)}
  return `<div class="item ${it.visible===false?'off':''}" data-coll="${coll}" data-id="${esc(it.id)}">${th}<div class="fields">${f}</div>${tools(list,it,coll,coll!=='services')}</div>`;
}
function chartSVG(days){
  const W=640,H=230,L=44,B=34,T=14,R=10,n=days.length;const max=Math.max(1,...days.map(d=>d.v));
  const top=max<=4?4:Math.ceil(max/4)*4;const iw=W-L-R,ih=H-T-B,bw=iw/n;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 14 天每日瀏覽次數長條圖">`;
  for(let k=0;k<=4;k++){const v=top*k/4,y=T+ih-ih*k/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#A9B1AD" stroke-width="${k?1:2}" ${k?'stroke-dasharray="3 4"':''}/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#4F5858" font-family="JetBrains Mono,monospace">${v}</text>`}
  days.forEach((d,i)=>{const h=ih*d.v/top,x=L+i*bw+bw*.16,w=bw*.68;s+=`<rect x="${x}" y="${T+ih-h}" width="${w}" height="${h}" fill="${hex(S.site.accent)}"><title>${d.k}：${d.v} 次</title></rect>`;
    if(i%2===0||i===n-1)s+=`<text x="${x+w/2}" y="${H-12}" text-anchor="middle" font-size="11" fill="#4F5858" font-family="JetBrains Mono,monospace">${d.k.slice(5)}</text>`});
  return s+'</svg>';
}
function overview(){
  const vis=c=>S[c].filter(x=>x.visible!==false);
  const miss=c=>vis(c).filter(x=>!x.imageId).length;
  const s=S.site,todo=[];
  if(miss('products'))todo.push(miss('products')+' 件商品還沒有圖片');
  if(miss('works'))todo.push(miss('works')+' 件作品還沒有圖片');
  if(miss('certs'))todo.push(miss('certs')+' 張證書還沒有圖片');
  if(!s.email&&!s.line)todo.push('還沒有填 Email 或 LINE');
  if(!s.analyticsId)todo.push('還沒有填統計代碼（要看點閱率才需要）');
  const tile=(n,c)=>`<div class="tile"><small>${n}</small><b>${vis(c).length}</b></div>`;
  return `<div class="tiles">${tile('商品','products')}${tile('作品','works')}${tile('服務','services')}${tile('證書證照','certs')}</div>
<div class="panel"><h3>發布狀態</h3><p>${S.dirty?'你有修改還沒發布。到「匯出網站」下載新的 index.html，再上傳到 Netlify，客人才會看到。':'目前和已發布的內容一致。'}</p><div class="tools"><button class="sm go" data-act="goexport">前往匯出網站</button></div></div>
<div class="panel"><h3>待辦</h3>${todo.length?todo.map(t=>`<div class="rowline"><span>${esc(t)}</span></div>`).join(''):'<p>沒有待辦事項。</p>'}</div>
<div class="panel"><h3>怎麼看點閱率</h3><p>這個網站檔本身不會記錄訪客人數。到「匯出網站」填入 Google Analytics 的統計代碼（G-開頭），重新匯出並上傳後，瀏覽人數、來源和裝置都到 Google Analytics 查看。</p></div>`;
}
function settings(){
  const s=S.site;const f=(k,t,ph,w,type)=>lbl(t,`<input data-sf="${k}" type="${type||'text'}" value="${esc(s[k])}" ${ph?`placeholder="${esc(ph)}"`:''}>`,w);
  return `<div class="panel"><h3>首頁主圖</h3><p>顯示在首頁最上方的大圖，建議橫式 16:9。換圖後網站會立刻更新。</p><div class="item" data-coll="site" data-id="main" style="border:0;padding:0;background:transparent">${thumb({...s,id:'main'},true)}</div></div>
<div class="panel"><h3>首頁文字</h3><div class="fields">${f('brand','工作室名稱','',1)}${f('eyebrow','小標（例如：網站設計・台北）','',1)}${f('tagline','主標第二行（一句話說你做什麼）','',1)}${lbl('介紹段落',`<textarea data-sf="lead">${esc(s.lead)}</textarea>`,1)}</div></div>
<div class="panel"><h3>聯絡與接案</h3><div class="fields">${f('email','Email')}${f('line','LINE ID')}${f('replyDays','幾個工作天內回覆','例如 2',0,'number')}${f('city','所在地','例如 台北 · UTC+8')}${f('deposit','訂金比例','例如 30%')}${f('revisions','免費修改次數','例如 2',0,'number')}</div></div>
<div class="panel"><h3>賣場說明</h3><div class="fields">${f('shopIntro','賣場標題旁的一句話','',1)}${lbl('付款、出貨與退換貨說明',`<textarea data-sf="shopNote">${esc(s.shopNote)}</textarea>`,1)}</div></div>
<div class="panel"><h3>證書區說明</h3><div class="fields">${f('certIntro','證書區標題旁的一句話','',1)}</div></div>
<div class="panel"><h3>網站上的後台按鈕</h3><label class="chk" style="margin-left:0"><input type="checkbox" data-sfc="showAdminBtn" ${s.showAdminBtn===false?'':'checked'}>在網站右下角顯示「進入後台」按鈕</label><p>關掉後客人看不到按鈕。你要進後台，就在網址後面加上 #admin。重新匯出並上傳後才會生效。</p></div>
<div class="panel"><h3>更改後台密碼</h3><p>密碼只是擋人誤入，不是真正的安全保護。修改後要重新匯出並上傳，網站上的密碼才會換掉。</p><div class="fields"><label><span>目前的密碼</span><input id="pw0" type="password" inputmode="numeric" autocomplete="off"></label><label><span>新密碼（至少 4 碼）</span><input id="pw1" type="password" inputmode="numeric" autocomplete="off"></label><label><span>再輸入一次新密碼</span><input id="pw2" type="password" inputmode="numeric" autocomplete="off"></label></div><div class="tools"><button class="sm go" data-act="setpw">更新密碼</button></div></div>
<div class="panel"><h3>網站重點色</h3><div class="sw">${SWATCHES.map(c=>`<button data-act="accent" data-c="${c}" style="background:${c}" aria-pressed="${hex(s.accent).toLowerCase()===c.toLowerCase()}" aria-label="顏色 ${c}"></button>`).join('')}</div></div>`;
}
function exportTab(){
  return `<div class="panel"><h3>更新網站</h3><p>${S.dirty?'你有修改還沒發布。':'目前和已發布的內容一致。'}你在後台改的內容，存在這支手機的瀏覽器裡。按下面的按鈕下載新的 index.html，再拖到 Netlify 覆蓋舊的，客人才會看到。</p>
<div class="fields"><label class="w"><span>統計代碼（選填，Google Analytics 的 G-XXXXXXXXXX）</span><input data-sf="analyticsId" value="${esc(S.site.analyticsId)}" placeholder="G-XXXXXXXXXX"></label></div>
<div class="tools"><button class="sm go" data-act="export" ${S.busy==='export'?'disabled':''}>${S.busy==='export'?'打包中…':'下載 index.html'}</button></div></div>
<div class="panel"><h3>上傳到 Netlify</h3><p>1. 登入 Netlify，進入你的網站，點「Deploys」。<br>2. 把下載的 index.html 放進資料夾，整個資料夾拖到頁面上的上傳區。<br>3. 等它顯示 Published，重新整理網站就會看到新內容。</p></div>
<div class="panel"><h3>備份提醒</h3><p>你的修改只存在這個瀏覽器。清除瀏覽資料、換手機或換瀏覽器之前，先下載一份 index.html 當備份。下載的檔案裡包含全部內容與圖片，隨時能再上傳。</p></div>`;
}
function renderAdmin(){
  const el=$('#admin');if(!S.open){el.hidden=true;return}
  if(!S.unlocked){renderGate(el);return}
  el.hidden=false;
  const TABS=[['overview','總覽'],['products','商品'],['works','作品'],['services','服務'],['certs','證書證照'],['settings','網站設定'],['export','匯出網站']];
  let body='';
  if(S.tab==='overview')body=overview();
  else if(S.tab==='settings')body=settings();
  else if(S.tab==='export')body=exportTab();
  else{
    const list=S[S.tab];const nm={products:'商品',works:'作品',services:'服務項目',certs:'證書'}[S.tab];
    body=`<div class="tools"><button class="sm go" data-act="add">＋ 新增${nm}</button><span class="ds">改完欄位離開輸入框就會自動儲存。</span></div>${list.length?list.map(it=>itemRow(S.tab,list,it)).join(''):`<div class="empty">還沒有${nm}。按「新增${nm}」建立第一筆。</div>`}`;
  }
  const keep=el.scrollTop;
  el.innerHTML=`<div class="ahd"><div class="wrap"><b>弘哥工作室・後台</b><button data-act="close">回到網站</button></div></div><div class="wrap"><div class="tabs" role="tablist">${TABS.map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${n}</button>`).join('')}</div><div class="ab">${body}</div></div><input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>`;
  el.scrollTop=keep;
}
function softRender(){renderSite();const a=document.activeElement;if(S.open&&!(a&&$('#admin').contains(a)&&/INPUT|TEXTAREA/.test(a.tagName)))renderAdmin()}

function sha256js(str){
  const enc=new TextEncoder().encode(str);
  const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const l=enc.length,n=((l+9+63)>>6)<<6,buf=new Uint8Array(n);buf.set(enc);buf[l]=0x80;
  const dv=new DataView(buf.buffer);dv.setUint32(n-8,Math.floor(l*8/0x100000000));dv.setUint32(n-4,(l*8)>>>0);
  const w=new Uint32Array(64),rotr=(x,r)=>(x>>>r)|(x<<(32-r));
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3),s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){const S1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])>>>0,S0=rotr(a,2)^rotr(a,13)^rotr(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
    H[0]+=a;H[1]+=b;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h;
  }
  return [...H].map(x=>x.toString(16).padStart(8,'0')).join('');
}
async function sha(t){
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  return sha256js(t);
}
function renderGate(el){
  const first=S.authLoaded&&!S.auth;
  el.hidden=false;
  el.innerHTML=`<div class="ahd"><div class="wrap"><b>弘哥工作室・後台</b><button data-act="close">回到網站</button></div></div><div class="wrap"><div class="ab" style="max-width:420px;padding-top:56px"><form id="gate" class="panel" autocomplete="off"><h3>${first?'設定後台密碼':'輸入後台密碼'}</h3>${first?'<p>還沒有設定密碼，請先設一組。</p>':''}<div class="fields"><label class="w"><span>${first?'新密碼（至少 4 碼）':'密碼'}</span><input id="gpw" type="password" inputmode="numeric" autocomplete="off" autofocus></label></div><p id="gerr" role="alert" style="color:var(--bad)">${esc(S.gateErr)}</p><div class="tools"><button class="sm go" type="submit">${first?'儲存並進入':'解鎖'}</button></div></form></div></div>`;
  const i=el.querySelector('#gpw');if(i)setTimeout(()=>i.focus(),50);
}
function unlockNow(){S.unlocked=true;S.gateErr='';S.fails=0;try{sessionStorage.setItem('hg_unlock','1')}catch(e){}}
function relock(){S.unlocked=false;try{sessionStorage.removeItem('hg_unlock')}catch(e){}}

let uploadTarget=null;
const A=$('#admin');
A.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;S.confirm=null;renderAdmin();return}
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  const row=b.closest('[data-id]');const coll=row&&row.dataset.coll,id=row&&row.dataset.id;
  try{
    if(act==='close'){relock();S.open=false;renderAdmin();if(location.hash==='#admin')history.replaceState(null,'',location.pathname);return}
    if(act==='accent'){S.site.accent=b.dataset.c;await db.doc('site/main').set({...S.site,accent:b.dataset.c});renderSite();renderAdmin();return}
    if(act==='add'){
      const c=S.tab,list=S[c];const order=list.reduce((m,x)=>Math.max(m,x.order||0),0)+1;
      const base={products:{name:'新商品',price:'NT$ ',desc:'',link:'',visible:true},works:{title:'新作品',type:'',year:String(new Date().getFullYear()),summary:'',link:'',visible:true},services:{name:'新服務項目',desc:'',price:'NT$ 起'},certs:{name:'新證書',issuer:'',date:'',expires:'',number:'',link:'',visible:true}}[c];
      await db.collection(c).add({...base,order});return;
    }
    if(act==='del'){const key=coll+'/'+id;if(S.confirm!==key){S.confirm=key;renderAdmin();setTimeout(()=>{if(S.confirm===key){S.confirm=null;renderAdmin()}},4000);return}S.confirm=null;await db.doc(key).delete();toast('已刪除');return}
    if(act==='up'||act==='down'){
      const list=S[coll];const i=list.findIndex(x=>x.id===id),j=act==='up'?i-1:i+1;if(j<0||j>=list.length)return;
      const a=list[i],c=list[j];let oa=a.order||0,oc=c.order||0;if(oa===oc)oc=oa+(act==='up'?-1:1);
      await Promise.all([db.doc(coll+'/'+a.id).update({order:oc}),db.doc(coll+'/'+c.id).update({order:oa})]);return;
    }
    if(act==='upload'){uploadTarget={coll,id};const f=$('#file');f.value='';f.click();return}
    if(act==='rmimg'){await db.doc(coll+'/'+id).update({imageId:''});return}
    if(act==='goexport'){S.tab='export';renderAdmin();return}
    if(act==='export'){await doExport();return}
    if(act==='setpw'){
      const cur=$('#pw0').value,n1=$('#pw1').value,n2=$('#pw2').value;
      if(!S.auth||await sha(S.auth.salt+cur)!==S.auth.hash){toast('目前的密碼不對');return}
      if(n1.length<4){toast('新密碼至少 4 碼');return}
      if(n1!==n2){toast('兩次輸入的新密碼不一樣');return}
      const salt=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('');
      await db.doc('auth/main').set({salt,hash:await sha(salt+n1)});
      $('#pw0').value=$('#pw1').value=$('#pw2').value='';toast('密碼已更新');return;
    }
  }catch(err){toast('操作失敗：'+(err&&err.message||err.code||'請再試一次'))}
});
A.addEventListener('submit',async e=>{
  if(e.target.id!=='gate')return;e.preventDefault();
  const pw=$('#gpw').value;
  try{
    if(S.authLoaded&&!S.auth){
      if(pw.length<4){S.gateErr='密碼至少 4 碼';renderGate(A);return}
      const salt=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('');
      await db.doc('auth/main').set({salt,hash:await sha(salt+pw)});unlockNow();renderAdmin();return;
    }
    if(!S.auth){S.gateErr='正在讀取，請稍後再試';renderGate(A);return}
    const now=Date.now();
    if(now<S.lockUntil){S.gateErr='嘗試太多次，請等 '+Math.ceil((S.lockUntil-now)/1000)+' 秒';renderGate(A);return}
    if(await sha(S.auth.salt+pw)===S.auth.hash){unlockNow();renderAdmin();return}
    S.fails++;if(S.fails>=5){S.lockUntil=now+30000;S.fails=0;S.gateErr='錯太多次，請等 30 秒再試'}else S.gateErr='密碼不對';
    renderGate(A);
  }catch(err){S.gateErr=err&&err.message||'驗證失敗';renderGate(A)}
});
A.addEventListener('change',async e=>{
  const t=e.target;
  try{
    if(t.id==='file'){
      const f=t.files&&t.files[0];if(!f||!uploadTarget)return;
      if(f.size>30*1024*1024){toast('圖片超過 30 MB，請先縮小');return}
      const {coll,id}=uploadTarget;S.busy=id;renderAdmin();
      try{const r=await assets.upload(f);await db.doc(coll+'/'+id).update({imageId:r.id});toast('圖片已更新')}
      catch(err){toast(err&&err.code==='unsupported_type'?'不支援這種圖片格式，請用 PNG、JPG 或 WebP':'上傳失敗：'+(err&&err.message||'請再試一次'))}
      S.busy='';renderAdmin();return;
    }
    const row=t.closest('[data-id]');
    if(row&&t.dataset.f){
      let v=t.type==='checkbox'?t.checked:t.value;
      if(t.dataset.f==='link'&&v&&!safeUrl(v)){toast('連結要以 https:// 開頭');t.value='';v=''}
      await db.doc(row.dataset.coll+'/'+row.dataset.id).update({[t.dataset.f]:v});
      return;
    }
    if(t.dataset.sfc){S.site={...S.site,[t.dataset.sfc]:t.checked};await db.doc('site/main').set(S.site);toast('已儲存');return}
    if(t.dataset.sf){
      S.site={...S.site,[t.dataset.sf]:t.value};
      await db.doc('site/main').set(S.site);toast('已儲存');
    }
  }catch(err){toast('儲存失敗：'+(err&&err.message||err.code||'請再試一次'))}
});

/* ---------- 本機資料與發布 ---------- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('hongge',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbPut(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
const ord=(a,b)=>(a.order||0)-(b.order||0);
function syncS(){
  S.site={brand:'弘哥工作室',...((DATA.site&&DATA.site.main)||{})};
  COLL.forEach(c=>{S[c]=Object.entries(DATA[c]||{}).map(([id,v])=>({id,...v})).sort(ord)});
  S.auth=(DATA.auth&&DATA.auth.main)||null;S.authLoaded=true;
}
let saveWarned=false;
async function commit(){
  S.dirty=true;syncS();softRender();
  try{await idbPut('draft',{data:DATA,dirty:true,baseRev})}
  catch(e){if(!saveWarned){saveWarned=true;toast('這個瀏覽器無法保存修改，請記得離開前下載備份')}}
}
const db={
  doc(p){const [c,id]=p.split('/');return{
    async set(d){(DATA[c]=DATA[c]||{})[id]=JSON.parse(JSON.stringify(d));await commit()},
    async update(d){DATA[c]=DATA[c]||{};DATA[c][id]={...(DATA[c][id]||{}),...d};await commit()},
    async delete(){if(DATA[c])delete DATA[c][id];await commit()}}},
  collection(c){return{async add(d){DATA[c]=DATA[c]||{};const id=Math.random().toString(36).slice(2,12);DATA[c][id]={...d};await commit();return{id}}}}
};
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.86))};
  im.onerror=()=>{URL.revokeObjectURL(u);rej({code:'unsupported_type',message:'無法讀取這張圖片'})};im.src=u})}
const assets={async upload(file){const url=await shrink(file);const id='i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);DATA.imgs=DATA.imgs||{};DATA.imgs[id]=url;return{id,url}}};

async function doExport(){
  S.busy='export';renderAdmin();
  try{
    const used=new Set([...S.products,...S.works,...S.certs].map(x=>x.imageId).filter(Boolean));if(S.site.imageId)used.add(S.site.imageId);
    const imgs={};used.forEach(id=>{if(DATA.imgs&&DATA.imgs[id])imgs[id]=DATA.imgs[id]});
    const rev=Date.now();
    const out={...JSON.parse(JSON.stringify(DATA)),imgs,rev};
    const json=JSON.stringify(out).replace(/</g,'\\u003c');
    const END='<'+'/script>';
    const re=new RegExp('(<script type="application/json" id="data">)[\\s\\S]*?('+END.replace('/','\\/')+')');
    const brand=esc(S.site.brand||'弘哥工作室');
    const meta=S.site.lead?'<meta name="description" content="'+esc(S.site.lead)+'">':'';
    const gid=/^G-[A-Z0-9]{4,}$/i.test(S.site.analyticsId||'')?S.site.analyticsId:'';
    const ga=gid?'<script async src="https://www.googletagmanager.com/gtag/js?id='+gid+'">'+END+'<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date());gtag("config","'+gid+'");'+END:'';
    let html=TEMPLATE.replace(re,(m,a,b)=>a+json+b);
    html=html.replace(/<title>[\s\S]*?<\/title>/,'<title>'+brand+'</title>').replace(/<!--META-->[\s\S]*?<!--\/META-->/,()=>'<!--META-->'+meta+'<!--/META-->').replace(/<!--GA-->[\s\S]*?<!--\/GA-->/,()=>'<!--GA-->'+ga+'<!--/GA-->');
    // 範本是載入當下的原始碼：去掉已被舊版匯出寫進去的 META/GA（若有）
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
    DATA.rev=rev;baseRev=rev;S.dirty=false;
    try{await idbPut('draft',{data:DATA,dirty:false,baseRev})}catch(e){}
    toast('已下載 index.html（'+(blob.size/1048576).toFixed(1)+' MB）');
  }catch(err){toast('匯出失敗：'+(err&&err.message||'請再試一次'))}
  S.busy='';renderAdmin();
}

/* ---------- 啟動 ---------- */
syncS();renderSite();
$('#fab').addEventListener('click',()=>{S.open=true;renderAdmin()});
window.addEventListener('hashchange',()=>{if(location.hash==='#admin'){S.open=true;renderAdmin()}});
(async()=>{
  try{const d=await idbGet('draft');if(d&&d.data&&(d.baseRev||0)>=(EMBED.rev||0)){DATA=d.data;DATA.imgs=DATA.imgs||{};S.dirty=!!d.dirty;baseRev=d.baseRev||baseRev;syncS();renderSite()}}catch(e){}
  if(location.hash==='#admin'){S.open=true;renderAdmin()}
})();
})();
</script>
